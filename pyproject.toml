[project]
name = "books-api"
version = "0.1.0"
description = "Minimal FastAPI books API on AWS Lambda + API Gateway + S3 (Floci)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.118",
    "fastapi>=0.162.0",
    "mangum>=0.22.0",
]

[dependency-groups]
dev = [
    "uvicorn>=0.54.0",
]
